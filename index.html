* { box-sizing: border-box; }
html, body { margin: 0; background: #120b07; color: #f5ecdc; font-family: var(--sans); }
body { overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
.mono { font-family: var(--mono); }
.sr { position: absolute; left: 0; top: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---------- scene ---------- */
.stage { position: relative; height: 100vh; overflow: hidden; background: #120b07; }
.cam { position: absolute; width: 0; height: 0; transform-style: preserve-3d; }
.cam > *, .book > * { position: absolute; }
/* The answer card lives in a second camera drawn on top, so the tilted desk can never cut through it. */
#cam2 { pointer-events: none; }
/* A hidden copy of the scene, always in the reading pose, used only for measuring. */
#cam3 { visibility: hidden; pointer-events: none; }

.book { left: 0; top: 0; transform-style: preserve-3d; }
/* Painted once under the cover so the three photos are decoded before the first page turn needs them. */
.warm { left: 0; top: 0; width: 6px; height: 6px; transform: translateZ(-15px); background: var(--ph-play), var(--ph-work), var(--ph-entrance); background-size: cover; }
.bshadow, .cover.lhalf, .sheet.lhalf, #left { transition: opacity .3s; }
.bshadow { left: -800px; top: -372px; width: 1090px; height: 760px; border-radius: 30px; background: rgba(0, 0, 0, .72); filter: blur(26px); transform: translateZ(-17px) translate(30px, 38px); }
.bshadow.half { left: -272px; width: 562px; opacity: 0; }
.cover { left: -264px; top: -376px; width: 540px; height: 752px; border-radius: 3px 9px 9px 3px; background: linear-gradient(90deg, #2a2b30, #101114 1.6%, #1b1c20); transform: translateZ(-14px); }
.cover.lhalf { left: -796px; width: 536px; border-radius: 9px 3px 3px 9px; background: linear-gradient(270deg, #2a2b30, #101114 1.6%, #1b1c20); }
/* Before the cover opens there is no left half to see. */
.book.closed .cover.lhalf, .book.closed .sheet.lhalf, .book.closed #left, .book.closed .bshadow:not(.half) { opacity: 0; transition: none; }
.book.closed .bshadow.half { opacity: 1; transition: none; }
.pgc.coverface { padding: 0; background: linear-gradient(100deg, #26272d, #16171b 55%, #1f2025); }
.cv { position: absolute; inset: 0; }
.cv-label { position: absolute; left: 62px; top: 132px; width: 318px; padding: 24px 26px 26px; background: #f4eedf; color: #17171b; rotate: -2deg; box-shadow: 0 1px 0 #cfc6b1, 3px 6px 14px rgba(0, 0, 0, .45); }
.cv-label small { display: block; font: 600 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #6a6558; }
.cv-label b { display: block; margin: 10px 0 8px; font: 800 44px/.98 var(--sans); letter-spacing: -.045em; }
.cv-label span { display: block; font: 600 19px/1.25 var(--sans); }
.cv-label em { display: block; margin-top: 12px; font: italic 15px/1.3 Georgia, serif; color: #4a4640; }
.cv .stamp { position: absolute; left: 78px; top: 452px; }
.cv-band { position: absolute; right: 54px; top: 0; bottom: 0; width: 17px; background: linear-gradient(90deg, #08090a, #1a1b1f 50%, #08090a); box-shadow: -2px 0 5px rgba(0, 0, 0, .4); }
.sheet { position: absolute; top: -360px; width: 520px; height: 720px; background: #e7e0cf; border: 1px solid #c9bfa9; }
.ribbon { left: -274px; top: 300px; width: 24px; height: 250px; transform-origin: 50% 0; transform: translateZ(-13px) rotate(6deg); background: linear-gradient(90deg, #a51f17, #e23a2e 45%, #9b1c15); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 93%, 0 100%); }
.pencil { left: 330px; top: 120px; width: 380px; height: 13px; transform: translateZ(-11px) rotate(-64deg); filter: drop-shadow(5px 7px 4px rgba(0, 0, 0, .55)); }

.rail { position: absolute; right: 20px; top: 32px; width: 198px; }
.rail small { display: block; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #6a6558; }
.rail h3 { margin: 6px 0 5px; font: 800 25px/1.05 var(--sans); letter-spacing: -.035em; }
.rail p { margin: 0 0 12px; font: 13px/1.38 var(--sans); color: #4c4841; }
.rail ol { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--sec); }
.rail li button { display: flex; gap: 8px; align-items: baseline; width: 100%; min-height: 40px; padding: 7px 7px; border: 0; border-bottom: 1px solid rgba(60, 50, 30, .2); background: none; text-align: left; font: 600 14.5px/1.2 var(--sans); color: #2b2b30; }
.rail li button i { flex: none; width: 17px; font: 600 10.5px var(--mono); color: #7d7769; }
.rail li button:hover { background: rgba(60, 50, 30, .09); }
.rail li button[aria-current=true] { background: color-mix(in srgb, var(--sec) 30%, transparent); box-shadow: inset 4px 0 0 var(--sec); color: #17171b; font-weight: 800; }
.rail li button[aria-current=true] i { color: #17171b; }
.meta, .ttl, .sub, .rule { flex: none; }
.meta { margin: 0; font: 600 11.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: #6a6558; }
.ttl { position: relative; margin: 22px 0 14px; font: 800 60px/.98 var(--sans); letter-spacing: -.045em; text-wrap: balance; }
.ttl.long { font-size: 45px; line-height: 1.02; }
.tape { position: absolute; width: 58px; height: 15px; background: var(--sec); opacity: .88; }
.tape.a { left: -16px; top: -13px; rotate: -5deg; }
.tape.b { right: 2px; bottom: -8px; width: 44px; rotate: 4deg; opacity: .7; }
.sub { margin: 0; font: 500 20px/1.34 var(--sans); letter-spacing: -.012em; color: #2b2b30; text-wrap: pretty; }
.rule { display: block; height: 3px; margin-top: 16px; border-radius: 2px; background: var(--sec); transform-origin: 0 50%; }
.figarea { flex: 1; min-height: 0; display: flex; align-items: center; padding-bottom: 16px; }
.fig { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
/* Stacked figure for pages with a short question: note on the left, sketch lower right. */
.fig.col { flex-direction: column; align-items: flex-start; gap: 20px; }
.fig.col .aside { flex: none; width: 100%; }
.fig.col .wfbox { align-self: flex-end; }
.fig.col .chips { max-width: none; gap: 10px 10px; }
.fig.col .chips li { font-size: 17px; padding: 8px 14px; }
.fig.col .chips.route { flex-direction: row; align-items: center; gap: 12px 34px; }
.fig.col .chips.route li + li::before { content: '→'; left: -26px; top: 7px; }
.fig.col .pol { width: 232px; }
.fig.col .pol i { height: 146px; }
.fig.col .stamp { width: 210px; }
.fig.col .tick { width: 250px; }
.fig.col .tick b { font-size: 34px; }
.aside { flex: 1; min-width: 0; }
.wfbox { flex: none; }
.wfbox svg { display: block; overflow: visible; }
.ink path { fill: none; stroke: #25252b; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
.wash { fill: var(--sec); }
.folio { position: absolute; left: 40px; right: 40px; bottom: 20px; margin: 0; display: flex; justify-content: space-between; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #7d7769; }

.pol { margin: 0 0 4px; width: 176px; padding: 8px 8px 6px; background: #fffdf7; rotate: -4deg; box-shadow: 2px 5px 12px rgba(40, 25, 10, .35); position: relative; }
.pol::before { content: ''; position: absolute; left: 34%; top: -9px; width: 62px; height: 17px; background: rgba(240, 206, 110, .85); rotate: -3deg; }
.pol i { display: block; height: 112px; background-size: cover; background-position: center; }
.pol figcaption { margin-top: 5px; font: 10px/1.3 var(--mono); color: #58534a; }
.stamp { width: 172px; padding: 14px 18px; border-radius: 8px; background: #5865f2; color: #fff; rotate: -5deg; box-shadow: 2px 5px 10px rgba(30, 20, 60, .35); }
.stamp svg { display: block; width: 100%; height: auto; }
.hand { margin: 16px 0 6px; font: italic 15px/1.3 Georgia, serif; color: #4a4640; rotate: -2deg; }
.tick { width: 180px; padding: 13px 16px 14px; background: #f6d985; border-left: 4px dotted #b48e3c; rotate: -3deg; box-shadow: 2px 5px 10px rgba(40, 25, 10, .28); }
.tick small { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #6b5720; }
.tick b { display: block; margin: 4px 0 5px; font: 700 27px/1 var(--mono); letter-spacing: -.04em; }
.tick span { display: block; font: 12.5px/1.3 var(--sans); color: #4c3f1c; }
.chips { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-wrap: wrap; gap: 9px 8px; max-width: 190px; }
.chips li { padding: 6px 11px; border: 2px solid #25252b; border-radius: 9px; background: #fffdf6; font: 700 14.5px/1.2 var(--sans); box-shadow: 2px 3px 0 #25252b; }
.chips li:nth-child(odd) { rotate: -2.5deg; }
.chips li:nth-child(even) { rotate: 2deg; }
.chips li:nth-child(1) { background: color-mix(in srgb, var(--sec) 34%, #fffdf6); }
.chips.route { flex-direction: column; align-items: flex-start; gap: 20px; }
.chips.route li + li { position: relative; }
.chips.route li + li::before { content: '↓'; position: absolute; left: 14px; top: -22px; font: 700 15px var(--mono); color: #25252b; }

/* ---------- turning leaf ---------- */
.leaf { left: -260px; top: -360px; width: var(--sw); height: 720px; transform-style: preserve-3d; transform: translateZ(.8px); pointer-events: none; }
.strip { position: absolute; left: var(--sw); top: 0; width: calc(var(--sw) + .6px); height: 720px; transform-style: preserve-3d; transform-origin: 0 50%; }
.leaf > .strip { left: 0; }
.ff, .fb { position: absolute; inset: 0; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.fb { transform: rotateY(180deg); }
.shade { position: absolute; inset: 0; background: #1a0f06; opacity: 0; pointer-events: none; will-change: opacity; }
/* Each strip keeps its own layer from the moment it is filled, so nothing is repainted once it starts to move. */
.strip, .ff, .fb { will-change: transform; }
/* For one frame the hidden side is painted too, almost transparent, so it is ready when it turns into view. */
.leaf.prime .fb { transform: none; opacity: .01; }

/* ---------- lifted answer card ---------- */
.cshadow { border-radius: 14px; background: rgba(20, 10, 2, .9); filter: blur(13px); transform-origin: 0 0; pointer-events: none; }
.card {
  transform-origin: 0 0; padding: 20px 26px 24px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .1); border-top: 5px solid var(--sec);
  background: linear-gradient(180deg, #23242b, #1a1b20 120px); color: #eef0f5;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 42px 80px -20px rgba(0, 0, 0, .8), 0 12px 26px rgba(0, 0, 0, .45);
}
.card header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sec); color: #fff; font-weight: 800; font-size: 18px; }
.av svg { width: 23px; height: auto; }
.card header b { display: block; font-size: 16.5px; letter-spacing: -.01em; }
.card header small { display: block; margin-top: 2px; font: 600 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--secl); }
.say { margin: 0; font-size: 21px; line-height: 1.48; letter-spacing: -.012em; text-wrap: pretty; }
.say.long { font-size: 18.5px; line-height: 1.5; }
.say.xlong { font-size: 17px; line-height: 1.5; }
.srcs { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .13); font: 12.5px/1.45 var(--sans); color: #b9bdc9; }
.lks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.lks .lk { margin-top: 0; }
blockquote.say::before { content: '“'; }
blockquote.say::after { content: '”'; }
.refl { margin-top: 16px; padding: 13px 15px; border-radius: 12px; background: #2a2c34; }
.refl small { font: 600 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: #ffd679; }
.refl p { margin: 6px 0 0; font-size: 15.5px; line-height: 1.5; color: #dfe2ea; }
.lk { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; margin-top: 12px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 99px; background: none; color: var(--secl); font-size: 14.5px; font-weight: 600; text-decoration: none; }
.lk:hover { background: rgba(255, 255, 255, .07); }
.corner { right: auto; left: 186px; top: 286px; width: 74px; height: 74px; padding: 0; border: 0; border-radius: 0 0 7px 0; transform: translateZ(1.2px); background: linear-gradient(315deg, #cfc5b0 0, #efe8d8 47%, rgba(40, 25, 10, .28) 50%, transparent 58%); clip-path: polygon(100% 0, 100% 100%, 0 100%); transition: scale .2s; transform-origin: 100% 100%; }
.corner:hover { scale: 1.18; }

/* ---------- screen-space layers ---------- */
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 46% 46%, transparent 48%, rgba(6, 3, 1, .62)); }
.dust { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #ffe7c2; opacity: 0; animation: mote 14s linear infinite; }
@keyframes mote { 0% { opacity: 0; translate: 0 0; } 15% { opacity: .5; } 80% { opacity: .35; } 100% { opacity: 0; translate: 46px -90px; } }

.hud { position: fixed; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 22px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud { transition: opacity .7s .5s; }
.gated .hud { opacity: 0; transition: none; }
.hud.top { top: 0; justify-content: space-between; }
.hud.bot { bottom: 0; justify-content: center; padding-bottom: 18px; }
.brand { padding: 9px 18px 10px; border-radius: 18px; background: rgba(22, 14, 9, .82); border: 1px solid rgba(255, 236, 205, .16); }
.brand h1 { margin: 0; font-size: 15.5px; letter-spacing: -.01em; }
.brand span { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #cdbfa6; }
.pill { display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 99px; background: rgba(22, 14, 9, .82); border: 1px solid rgba(255, 236, 205, .16); box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.pill button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 99px; background: none; font-size: 14px; font-weight: 600; color: #e9dcc6; white-space: nowrap; }
.pill button:hover:not(:disabled) { background: rgba(255, 236, 205, .1); }
.pill button:disabled { opacity: .35; cursor: default; }
.secs button { display: flex; align-items: center; gap: 8px; }
.secs button::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.secs button[aria-pressed=true] { background: #f5ecdc; color: #1c130c; }
.pill .where { min-width: 150px; padding: 0 14px; text-align: center; line-height: 1.2; }
.where b { display: block; font-size: 13.5px; }
.where span { font: 600 10.5px var(--mono); letter-spacing: .1em; color: #cdbfa6; }
#next { background: #f5ecdc; color: #1c130c; }
#next:hover:not(:disabled) { background: #fff; }

dialog { width: min(580px, 94vw); max-height: 86vh; padding: 22px 26px; border: 1px solid #5a4632; border-radius: 16px; background: #1d1510; color: #f5ecdc; }
dialog::backdrop { background: rgba(8, 4, 2, .72); }
dialog header { display: flex; justify-content: space-between; align-items: center; }
dialog h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
dialog header button { min-height: 44px; border: 0; background: none; font-weight: 600; }
dialog h3 { display: flex; align-items: center; gap: 8px; margin: 18px 0 4px; font: 600 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #cdbfa6; }
dialog h3::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
dialog ol { margin: 0; padding: 0; list-style: none; }
dialog li button { width: 100%; min-height: 42px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 15.5px; }
dialog li button:hover { background: rgba(255, 236, 205, .08); }
dialog li button[aria-current=true] { background: rgba(255, 236, 205, .14); font-weight: 700; }

/* ---------- opening ---------- */
.gate { position: fixed; inset: 0; z-index: 30; overflow: hidden; }
.gate > * { position: absolute; }
.night { inset: 0; background: radial-gradient(ellipse at 50% 45%, #1d140d, #0c0705 70%); transition: opacity .8s ease-in; }

.paper p { margin: 0; }
.g-kicker { font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6a6558; }
.g-title { margin: 12px 0 8px !important; font: 800 clamp(40px, 6.4vw, 76px)/.98 var(--sans); letter-spacing: -.05em; }
.g-sub { font: 500 clamp(16px, 1.7vw, 21px)/1.3 var(--sans); color: #45424a; }
.g-hint { margin-top: 34px !important; font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6a6558; }
.env { position: relative; width: min(430px, 78vw); aspect-ratio: 3 / 2; margin-top: 40px; border-radius: 10px; background: linear-gradient(180deg, #6a76ff, #5865f2 55%, #4a56d8); box-shadow: 0 2px 0 #3f49b8, 0 26px 44px -18px rgba(40, 30, 90, .6), 0 6px 14px rgba(40, 30, 90, .25); animation: bob 5s ease-in-out infinite alternate; }
@keyframes bob { from { translate: 0 -5px; rotate: -.6deg; } to { translate: 0 5px; rotate: .6deg; } }
.env i { position: absolute; inset: 0; border-radius: 10px; }
.env-low { background: linear-gradient(180deg, #5562ee, #4753d6); clip-path: polygon(0 100%, 0 12%, 50% 62%, 100% 12%, 100% 100%); }
.env-flap { background: linear-gradient(180deg, #7c87ff, #5f6bf4); clip-path: polygon(0 0, 100% 0, 50% 60%); filter: drop-shadow(0 4px 5px rgba(20, 18, 70, .4)); }
.seal {
  position: absolute; left: 50%; top: 58%; width: 92px; height: 92px; margin: -46px 0 0 -46px; padding: 0; border: 0; border-radius: 47% 53% 50% 50% / 52% 48% 53% 47%;
  display: grid; place-items: center; color: #7d5208;
  background: radial-gradient(circle at 34% 28%, #ffe9a6, #f0bb3f 42%, #c98d1e 78%, #a8720f);
  box-shadow: inset 0 0 0 7px rgba(255, 240, 190, .22), inset 0 -5px 9px rgba(120, 70, 0, .45), 0 5px 12px rgba(30, 20, 70, .5);
  transition: scale .18s;
}
.seal svg { width: 46px; height: auto; filter: drop-shadow(0 1px 0 rgba(255, 240, 200, .6)); }
.seal:hover { scale: 1.07; }
.seal:active { scale: .95; }
.seal::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid rgba(240, 187, 63, .8); animation: ring 2.2s ease-out infinite; }
@keyframes ring { from { scale: .92; opacity: .9; } to { scale: 1.55; opacity: 0; } }
.flash { inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 58%, #fff8e6, rgba(255, 226, 160, .7) 30%, transparent 70%); }
#fx { inset: 0; width: 100%; height: 100%; pointer-events: none; }
.skip { right: 22px; bottom: 20px; min-height: 44px; padding: 0 18px; border-radius: 99px; border: 1px solid rgba(60, 50, 30, .35); background: rgba(255, 252, 244, .6); color: #2b2a2e; font-size: 14px; font-weight: 600; transition: color .4s, background .4s, border-color .4s; }
.gate.go .paper { opacity: 0; transform: scale(1.07); pointer-events: none; }
.gate.go .flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: 0; } 22% { opacity: .95; } 100% { opacity: 0; } }
.gate.go .skip { color: #e9dcc6; background: rgba(22, 14, 9, .6); border-color: rgba(255, 236, 205, .25); }
.gate.out { pointer-events: none; }
.gate.out .night { opacity: 0; }
.gate.out .skip { opacity: 0; transition: opacity .3s; }
.gate.fast, .gate.fast .night { transition: opacity .25s; }
.gate.fast { opacity: 0; }

@media (max-width: 759px) {
  .hud { padding: 8px; }
  .brand, .hud.top > .pill:last-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .secs { width: 100%; justify-content: space-between; gap: 0; }
  .secs button { min-height: 44px; padding: 0 9px; gap: 6px; font-size: 12.5px; }
  .hud.bot { padding-bottom: 12px; }
  .pill .where { min-width: 124px; }

<script>
const P = [{"c": 0, "title": "The team", "sub": "What does your team at Discord do, and what does a normal working day look like for you?", "meta": "Question 06 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I work on the design systems and accessibility team. We&#x27;re responsible for defining the visual language of the application and define primitives and guidelines so that our engineers and designers working on the product have tools that&#x27;re accessible by default.", "verb": true, "aside": {"t": "stamp", "cap": "Design Systems &amp; Accessibility"}, "links": [{"to": 11, "label": "What he added in the live Q&amp;A"}, {"to": 29, "label": "My note on his team"}]}, {"c": 0, "title": "Being a user", "sub": "What are the best parts of working at Discord? And is there something that is harder than people from outside think?", "meta": "Question 07 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I loved discord as a product, being part of its creation is fun.", "verb": true, "aside": {"t": "photo", "k": "play", "cap": "Discord Careers · gaming at the office"}}, {"c": 0, "title": "Remote work", "sub": "Your team works from different time zones. How does remote work feel for you, and how do you stay connected with your teammates?", "meta": "Question 08 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I am so used to being remote at this point. Everyone in Silicon Valley does. We use Discord heavily for communication.", "verb": true, "aside": {"t": "photo", "k": "work", "cap": "Discord Careers · office workstations"}, "links": [{"to": 25, "label": "My research on how people work"}]}, {"c": 0, "title": "Changing roles", "sub": "You started in backend, moved to frontend and later to accessibility. How did you know each time that it was the right move? How did you end up in design systems and accessibility? Was there one moment that made you choose this field?", "meta": "Question 05 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "Mostly circumstances. I started on backend because that was my role in the company we founded right after college. Then I started working at Koding, then I switched to frontend because there was a need for frontend-focused folks. Then i loved working on frontend: performance, attention to detail. I did that for 10 years and finally wanted to switch again to have a specialized role. I met with accessibility, then I got hooked because I love working with big companies to ensure they stay accessible for everyone.", "verb": true, "aside": {"t": "chips", "items": ["Backend", "Frontend", "Accessibility"], "route": true}, "links": [{"to": 16, "label": "What he added in the live Q&amp;A"}]}, {"c": 0, "title": "Finding a field", "sub": "Many new students like me do not know yet which area they like. Frontend, backend, data, security, games. How can a new student find out which area really fits them?", "meta": "Question 04 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "One of the beautiful things about school is that you actually have years ahead of you, and you can actually try all of those things you listed to see which one is most fun for you. Computer science is much more than just web technologies, that means you have to read constantly and learn. That&#x27;s why you have to try them all and see which one is most fun for you so you can keep learning without getting bored.", "verb": true, "aside": {"t": "chips", "items": ["Frontend", "Backend", "Data", "Security", "Games"], "route": false}, "links": [{"to": 9, "label": "What he added in the live Q&amp;A"}]}, {"c": 0, "title": "Grades and interests", "sub": "You once said you were a “bad student”, but you knew what you wanted to do. What did you want back then, and how did you find it?", "meta": "Question 02 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I always knew that I wanted to work with computers ever since I saw one. So instead of focusing on getting good grades, I focused on getting just enough grades AND becoming very good at computers. That turned out to be a good decision for me.", "verb": true, "aside": {"t": "chips", "items": ["“just enough grades”", "AND", "“very good at computers”"], "route": false}}, {"c": 0, "title": "Student life", "sub": "Can you tell me a little about your student years at İTÜ and Binghamton? What was student life like, and what did you spend most of your time on outside the classes?", "meta": "Question 01 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I was teaching folk dance and playing World of Warcraft all the time.", "verb": true, "aside": {"t": "chips", "items": ["folk dance", "World of Warcraft"], "route": false}}, {"c": 0, "title": "Moving abroad", "sub": "I moved to the Netherlands this year to study, so this question is close to me. What was the hardest part when you started studying in the US, and what helped you to settle in?", "meta": "Question 03 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "Loneliness. Being away and knowing you&#x27;ll be away for a while. It was hard in the beginning, but once i found my community, things got better and better. Friends and friendships are important.", "verb": true, "aside": {"t": "chips", "items": ["Loneliness.", "“once i found my community”"], "route": true}, "refl": "His answer confirmed what I live now. I have the same thing. Even in normal life it is hard to be understood, and in a totally different place it is even harder. Someone who works at Discord today and is successful had the same feeling in the beginning. This showed me that it is normal to struggle and that it can get better."}, {"c": 0, "title": "Working with agents", "sub": "Outside Discord you do live streams, you are part of the Kampüs community and you have a lot of projects on GitHub. What are you working on these days outside your job, and why is it important for you?", "meta": "Question 09 · Hasan to Umut · email", "av": "U", "name": "Umut Şirin", "role": "Written answer · November 2026", "body": "I am building a new development/coding environment to build the foundations of how i am working with LLM agents today and in the future.", "verb": true, "aside": {"t": "chips", "items": ["LLM agents", "“today and in the future”"], "route": false}, "links": [{"to": 14, "label": "What he added in the live Q&amp;A"}]}, {"title": "Know what you want", "sub": "A student who had just finished first year asked what he could do about his future.", "body": "Umut said the people he saw struggle after graduating were the ones who did not know what they wanted to do. He would use the years at university to try many courses and find that out, instead of worrying from the first day about how to earn money later. His other tip was about asking experienced people for help: say what you want to do, then ask how to get there.", "aside": {"t": "chips", "items": ["Know what you want", "Ask a specific question"], "route": true}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 4, "label": "Read his email answer"}, {"to": 30, "label": "Volkan on the same question"}]}, {"title": "What is a junior?", "sub": "Umut brought up a question he often hears from new graduates.", "body": "Umut compared a junior engineer to a guitarist joining a band for the first time. The band can expect you to play your instrument well. Playing with other people, and playing a concert, is the part you have not done yet, and mistakes there are fine. For software he meant the language, the tools, the editor and the AI model you use. A new graduate and a junior, he said, are not the same thing.", "aside": {"t": "chips", "items": ["Play your instrument", "Join the band"], "route": true}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase"}, {"title": "Which area is open?", "sub": "A student asked which areas of the sector have the most open future.", "body": "Umut said he could not give a useful answer, because his own working life is changing so fast. He works in a niche, design systems and accessibility, and he feels it may move to the centre of frontend work. A year ago he would not have said that. He also wonders whether frontend, as it is done today, will still exist.", "aside": {"t": "chips", "items": ["Design systems", "Accessibility", "Frontend?"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 0, "label": "Read his email answer"}]}, {"title": "The work is being rewritten", "sub": "The host asked whether the real skill is adapting to change.", "body": "Umut called AI agents one more tool in the kit, next to the editor, the browser and the terminal, and one you have to get good at. He also said the way software products are built is being rewritten right now. He called the story of “I knew nothing and still built a product” misleading. If someone with no background can do that much, he said, think what a person who knows the craft can do with the same tools.", "aside": {"t": "chips", "items": ["Editor", "Browser", "Terminal", "Agents"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase"}, {"title": "Fundamentals and types", "sub": "A student asked what to learn before graduating that will still be useful later.", "body": "Umut named data structures and type systems first, and suggested investing in a typed language such as TypeScript. His reason was practical: when types describe a system, you can understand it without reading every line, and so can an agent. He said basic computer science and software engineering knowledge matters more now than when he studied, and that students should start learning how a tech lead thinks.", "aside": {"t": "chips", "items": ["Data structures", "Type systems", "TypeScript"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 34, "label": "Volkan on the same question"}]}, {"title": "When the tool is wrong", "sub": "The second half of the same answer.", "body": "Umut suggested building small projects with an agent and watching where it breaks, then shaping your own way of working around that. In his view the difference is knowing the system already, so the tool speeds up your work and does not do the thinking for you. He added that other people’s experiments go out of date quickly, so you have to run your own.", "aside": {"t": "chips", "items": ["Build", "Watch it break", "Adjust"], "route": true}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 8, "label": "Read his email answer"}]}, {"title": "Build things together", "sub": "Still on what to do before graduating: group projects and hackathons.", "body": "Umut told students not to avoid bigger projects with two or three friends. Working with others taught him to respect other people’s time and to be part of a team. He said his own career began in a third-year software engineering project, where he understood that frameworks exist so that people can work together. Being bad at the start is normal, he said. His method was to keep making things.", "aside": {"t": "chips", "items": ["Two or three friends", "One project"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase"}, {"title": "The decision at Twitch", "sub": "A student asked about the moment each of them chose a specialty, and whether they could change later.", "body": "At Twitch, Umut worked across the stack. Around the time he helped on a volunteer project after the earthquake in Türkiye, he began questioning what he wanted to spend his working hours on. He said Twitch had an accessibility case to answer and nobody was looking after that work, so he asked for it. After he was laid off, he applied directly to the design systems and accessibility team at Discord.", "aside": {"t": "chips", "items": ["Twitch", "Accessibility", "Discord"], "route": true}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 3, "label": "Read his email answer"}, {"to": 32, "label": "Volkan on the same question"}]}, {"title": "Teacher first", "sub": "A student asked how to learn to use AI well for software, and which mistakes to avoid.", "body": "Umut’s advice was to keep learning and building apart. Do not half learn something in the middle of a project. Ask the AI to teach you first, in a separate session, and build afterwards. For going further he recommended the site AI Hero, because it is about building a working system around the tools and not about hype.", "aside": {"t": "chips", "items": ["Learn", "Build"], "route": true}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 36, "label": "Volkan on the same question"}]}, {"title": "Portfolio projects", "sub": "The host asked how interviewers look at GitHub projects that were made with AI.", "body": "Umut’s test was whether you can talk through what you made. He would include an AI-assisted project if you can explain it. He also warned that a long list of small experiments can bury the few projects you really want someone to notice. A good interviewer is collecting signals, he said, and one project you really built gives them most of what they need.", "aside": {"t": "chips", "items": ["Can you talk about it?"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 37, "label": "Volkan on the same question"}]}, {"title": "Is AI taking our jobs?", "sub": "The host’s last question.", "body": "Umut does not think software engineers are going anywhere. What he sees shrinking are the roles around them, because one engineer is now expected to carry work that used to pass through several teams. He expects more small companies of three or four people. At Discord, he said, AI use is not part of performance reviews. He told students he would not be afraid, and that he now wishes he had listened more closely in class.", "aside": {"t": "chips", "items": ["Engineers stay", "Roles around them shrink"], "route": false}, "c": 1, "meta": "Live Q&amp;A · Vadideki Geyik", "av": "U", "name": "Umut Şirin", "role": "Live Q&amp;A · my English paraphrase", "links": [{"to": 38, "label": "Volkan on the same question"}]}, {"title": "Before Discord", "sub": "How I knew the product before this quest.", "body": "I do not remember the first time I used Discord, but I remember the time before it. We used TeamSpeak to talk while we played games. Then Discord came and it dominated the sector. Discord is free to use. People can join a server and use different channels to talk by voice, video or text.", "aside": {"t": "chips", "items": ["TeamSpeak", "Discord"], "route": true}, "srcs": null, "meta": "My research · Quest 5, Part 1", "role": "My research · Part 1", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "The company", "sub": "What kind of company it is and what it sells.", "body": "Discord is a private software company. Its main product is the app itself. It launched in May 2015, after the founders had been working on a game. Discord also sells a subscription called Nitro. I use it myself and have the badge for three years of Nitro.", "aside": {"t": "stamp", "cap": "Private company · launched May 2015"}, "srcs": "Sources for Part 1: Discord on LinkedIn; Discord, Company Information; Discord, Thank You for Ten Years (May 2025).", "meta": "My research · Quest 5, Part 1", "role": "My research · Part 1", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "Where it is", "sub": "Offices and size.", "body": "The main office is in San Francisco. On LinkedIn, Discord lists its company size as 501 to 1,000 employees. It also has a Dutch company, Discord Netherlands B.V., registered at Schiphol.", "aside": {"t": "photo", "k": "entrance", "cap": "Discord Careers · the office entrance"}, "srcs": "Sources for Part 1: Discord on LinkedIn; Discord, Company Information; Discord, Thank You for Ten Years (May 2025).", "meta": "My research · Quest 5, Part 1", "role": "My research · Part 1", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "Who uses it", "sub": "The detail that stood out to me.", "body": "One thing that stood out to me was how many Discord users still play games. In May 2025, Discord said it had more than 200 million monthly users and that over 90 percent had played a game in the previous 30 days. I knew Discord from gaming, but I also see people using it just to talk with friends.", "aside": {"t": "ticket", "k": "May 2025", "big": "90%+", "cap": "had played a game in the previous 30 days"}, "srcs": "Sources for Part 1: Discord on LinkedIn; Discord, Company Information; Discord, Thank You for Ten Years (May 2025).", "meta": "My research · Quest 5, Part 1", "role": "My research · Part 1", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "How it started", "sub": "Company background.", "body": "Jason Citron and Stanislav Vishnevskiy started Discord. They were making a game before they turned their attention to a problem they knew as players: it was difficult to talk with friends while playing online. In 2021, Microsoft was in talks to buy Discord for about 10 billion dollars. The talks ended without a deal and Discord stayed independent.", "aside": {"t": "chips", "items": ["Making a game", "Talking while playing", "Discord"], "route": true}, "srcs": "Sources: Discord, Discord’s Next Chapter; TechCrunch, 20 April 2021, on the end of the talks with Microsoft.", "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "How people work", "sub": "Working culture, and what Umut told me about his own team.", "body": "Discord says “great work can happen anywhere.” Its careers page lists some jobs in San Francisco, some in other cities and some as remote. Umut gave me a more specific answer about his own team. He is used to working remotely, and when I asked how he stays in touch with his teammates, he said they use Discord itself.", "aside": {"t": "chips", "items": ["San Francisco", "Other cities", "Remote"], "route": false}, "srcs": "Sources: Discord, Careers; my written interview with Umut Şirin.", "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan", "links": [{"to": 2, "label": "Read Umut’s answer"}]}, {"title": "The technology", "sub": "What Discord is built with.", "body": "Discord uses Python for its API and Elixir to pass messages on to people connected to a server. Its engineers wrote some of the services that handle message data in Rust. The messages are stored in a database called ScyllaDB. For the part of the app that people see and use, Discord uses React on desktop and React Native on mobile.", "aside": {"t": "chips", "items": ["Python", "Elixir", "Rust", "ScyllaDB", "React"], "route": false}, "srcs": "Sources: Discord Engineering, Tracing Discord’s Elixir Systems; How Discord Stores Trillions of Messages; Supercharging Discord Mobile.", "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "Behind a message", "sub": "One example from Discord’s engineering blog.", "body": "When a large server receives an announcement, many people may request the same message at once. Discord Engineering describes how a Rust service combines those reads before querying ScyllaDB. This is a different part of the product from Umut’s interface work.", "aside": {"t": "chips", "items": ["Many requests", "One read", "ScyllaDB"], "route": true}, "srcs": "Source: Discord Engineering, How Discord Stores Trillions of Messages.", "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "The sector", "sub": "Where I would place Discord.", "body": "I would put Discord somewhere between gaming and social media. The chat side reminds me of Slack, Telegram and WhatsApp, but Discord was built for people who want to talk before, during and after a game.", "aside": {"t": "chips", "items": ["Gaming", "Social media"], "route": false}, "srcs": null, "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan"}, {"title": "Umut’s team", "sub": "What his team makes, in my own words.", "body": "I asked Umut what his team actually makes. He said they work on the basic parts of the app and write guidelines for the engineers and designers who use them. Accessibility means that people with disabilities can use the app too, for example with a screen reader. From his answer, I understood that his team works on this before another team uses those parts to build a feature.", "aside": {"t": "chips", "items": ["Basic parts", "Guidelines", "Screen reader"], "route": false}, "srcs": "Source: my written interview with Umut Şirin, November 2026.", "meta": "My research · Quest 5, Part 2", "role": "My research · Part 2", "c": 2, "av": "H", "name": "Hasan Furkan", "links": [{"to": 0, "label": "Read Umut’s answer"}]}, {"title": "Build me a phone", "sub": "The first-year student’s question: what can I do about my future?", "body": "Volkan said the first goal is simply to finish the degree, but that the grade is not the point. He described a course where the quizzes are about diodes and transistors, and the final exam then asks you to design a phone. It feels unfair, he said, but work is like that. Nobody hands you a clear task. You have to understand a vague problem and solve it within the time, budget and team you have.", "aside": {"t": "chips", "items": ["Diode", "Transistor", "A phone?"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 9, "label": "Umut on the same question"}]}, {"title": "Work backwards", "sub": "On asking better questions and choosing a direction.", "body": "Volkan said learning to ask a precise question is a skill of its own. He borrowed an idea from Amazon’s leadership principles: picture where you want to be, then work backwards to see what is missing. He also warned against wanting a field only because someone you admire is good at it. In first year he would read through the whole curriculum, and outside his own department too, to find what really pulls him.", "aside": {"t": "chips", "items": ["Where you want to be", "Where you are now"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase"}, {"title": "Not a straight line", "sub": "The question about turning points and changing fields.", "body": "Volkan studied electrical and electronics engineering at Boğaziçi University, with computer engineering alongside it, and graduated during an economic crisis when companies were letting people go. He started with web and content management work. Later he worked at an insurance company, started his own company, closed it and went back to corporate work. Changing fields was never hard for him, he said, because every job is solving a problem. The hard part is convincing the person who hires you.", "aside": {"t": "chips", "items": ["Electronics", "Web", "Insurance", "Startup", "Broadcom"], "route": false}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 16, "label": "Umut on the same question"}]}, {"title": "Git ↔ Jira", "sub": "On his own recent work: bringing AI into how his company builds software.", "body": "Volkan described a practical obstacle to using agents at Broadcom. Developers wanted to work from specifications and keep their work in the repository. Managers still checked Jira to see what was happening. Moving the work into Git would only solve half the problem: the reports had to stay in sync without asking engineers to enter everything twice.", "aside": {"t": "chips", "items": ["Git", "Jira"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase"}, {"title": "One engineer, end to end", "sub": "The question about what to learn before graduating.", "body": "Volkan said his company hires very few juniors right now. In the workflow he remembered, a project manager defined an epic, and a team lead split the stories into tasks and handed them out. Today one engineer can be expected to take a whole project from start to finish, once its scope is clear. That needs the fundamentals, and it needs communication too: even working alone, you still have to explain your choices and convince other people.", "aside": {"t": "chips", "items": ["Epic", "Story", "Task"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 13, "label": "Umut on the same question"}]}, {"title": "Boxes and arrows", "sub": "On what stays the same while the tools change.", "body": "Volkan said every system he has worked on comes down to parts and how they talk to each other. It is true for a web page built from components, for infrastructure, and for a company, where the parts used to be people and are now sometimes agents. You draw boxes and connect them with arrows. The code, he said, is the icing on the cake, and nobody hires a baker for the icing alone.", "aside": {"t": "chips", "items": ["Parts", "How they talk"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase"}, {"title": "Learn, then copy well", "sub": "The question about learning to use AI.", "body": "Volkan described a study he had read that compared new developers. Those who used AI to learn as they went improved more than those who accepted whatever it produced. His own habit is to keep asking what is actually happening, so the skill does not fade. For practice he suggested copying people who explain things well, and joining an existing open source project before starting your own. A rejected pull request, he said, is not the end of the world.", "aside": {"t": "chips", "items": ["Learn with it", "Copy well", "Contribute"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 17, "label": "Umut on the same question"}]}, {"title": "What an interview hears", "sub": "The question about AI-made projects on GitHub.", "body": "Volkan told a story from a recent interview. A candidate’s résumé listed a technology he knows well, so he asked about two related terms. The candidate knew the first and guessed at the second. For Volkan the signal is not the project. It is how much you understand of what sits underneath it. He compared it to a chair that helpers built for you: can you say how it was made, and fix it when a leg breaks?", "aside": {"t": "chips", "items": ["The project", "What is underneath"], "route": true}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 18, "label": "Umut on the same question"}]}, {"title": "Push back", "sub": "On jobs, and on trusting the tool.", "body": "Volkan does not think AI is taking engineers’ jobs, but he sees the gap growing between people who really know the work and people who only got by. A team of ten may become a team of two. He also said these tools tend to flatter you, so you have to push back: is that true, is there a simpler way, did you check the code? In his view the industry is reaching a point where it will not want someone who does not question.", "aside": {"t": "chips", "items": ["Is that true?", "Is there a simpler way?"], "route": false}, "c": 3, "meta": "Appendix · a second industry view", "av": "V", "name": "Volkan Özçelik", "role": "Broadcom · live Q&amp;A · my paraphrase", "links": [{"to": 19, "label": "Umut on the same question"}]}];

  const oy = m ? 66 + 318 * s : vh * .5, ox = m ? vw * .5 : Math.max(vw * .33, 478 * s + 64);
  return {
    m, s, vw, vh,
    ox, oy,
    persp: m ? 1100 : 1900,
    cardW: m ? vw - 24 : clamp(vw * .365, 400, 560),
    cardX: m ? 12 : Math.max(vw * .525, ox + 262 * s + 6), cardY: m ? oy + 150 * s : vh * .2,
    cardZ: m ? 90 : 150,

}
const poseB = () => ({ rx: M.m ? 31 : 27, rz: M.m ? -5 : -6, s: M.s, fx: 0, fy: 0 });

  const v = [{ rx: 53, rz: -19 }, { rx: 47, rz: 14 }, { rx: 57, rz: -8 }, { rx: 49, rz: 22 }][i % 4];

}
const mixPose = (a, b, t) => ({ rx: mixn(a.rx, b.rx, t), rz: mixn(a.rz, b.rz, t), s: mixn(a.s, b.s, t), fx: mixn(a.fx, b.fx, t), fy: mixn(a.fy, b.fy, t) });
const camString = (p, px, py) => 'scale(' + p.s + ') rotateX(' + (p.rx + py) + 'deg) rotateZ(' + (p.rz + px) + 'deg) translate3d(' + (-p.fx) + 'px,' + (-p.fy) + 'px,0)';

  M = metrics();

  stage.style.perspectiveOrigin = (M.vw / 2) + 'px ' + (M.vh * .46) + 'px';
  for (const c of [cam, cam2, cam3]) { c.style.left = M.ox + 'px'; c.style.top = M.oy + 'px'; }
  cam3.style.transform = camString(poseB(), 0, 0);   /* the measuring camera always sits in the reading pose */
  wfSize = {};
  geo = {};
}

/* ---------- camera ---------- */
function writeCam(p, px, py) { cam.style.transform = cam2.style.transform = camString(p, px, py); }
function setCam(p) { camNow = p; writeCam(p, par.x, par.y); }
function parallaxTick() {
  par.x += (par.tx - par.x) * .07;
  par.y += (par.ty - par.y) * .07;
  if (camNow) writeCam(camNow, par.x, par.y);
  par.raf = Math.abs(par.tx - par.x) + Math.abs(par.ty - par.y) > .01 ? requestAnimationFrame(parallaxTick) : 0;
}
addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'mouse' || reduce.matches || M.m) return;
  par.tx = (ev.clientX / innerWidth - .5) * -5;
  par.ty = (ev.clientY / innerHeight - .5) * -3.4;
  if (!par.raf) par.raf = requestAnimationFrame(parallaxTick);
});

/* ---------- page markup ---------- */
function aside(a) {
  if (a.t === 'photo') return '<figure class="pol"><i role="img" aria-label="' + a.cap + '" style="background-image:var(--ph-' + a.k + ')"></i><figcaption>' + a.cap + '</figcaption></figure>';
  if (a.t === 'stamp') return '<div class="stamp" role="img" aria-label="Discord">' + LOGO + '</div><p class="hand">' + a.cap + '</p>';
  if (a.t === 'ticket') return '<div class="tick"><small>' + a.k + '</small><b>' + a.big + '</b><span>' + a.cap + '</span></div>';
  return '<ul class="chips' + (a.route ? ' route' : '') + '">' + a.items.map(x => '<li>' + x + '</li>').join('') + '</ul>';
}
function dashOffset(i, n, d) { return clamp(1 - (d * (n + 2) - i) / 3); }
/* How far the page's own drawing has come, for d from 0 (blank) to 1 (finished). */
function drawState(d) {
  return { rule: 'scaleX(' + clamp(d * 2.2) + ')', ao: clamp(d * 2.4 - .3), at: 'translateY(' + ((1 - d) * 20) + 'px)', wash: clamp(d * 4 - 3) * .13 };
}
/* A pencil sketch of the answer card. The wobble is worked into the lines themselves, so nothing is filtered while it moves. */
function wireframe(w, h, p, d) {
  const L = [];
  let seed = w * 3 + h;
  const j = a => (rnd(seed++) - .5) * 2 * a;
  const f = v => Math.round(v * 10) / 10;
  const line = (x1, y1, x2, y2) => L.push('M' + f(x1 + j(.8)) + ' ' + f(y1 + j(.9)) + 'Q' + f((x1 + x2) / 2 + j(5)) + ' ' + f((y1 + y2) / 2 + j(1.5)) + ' ' + f(x2 + j(1.6)) + ' ' + f(y2 + j(.9)));
  const box = (x, y, bw, bh, r) => {
    const e = [[x + r, y], [x + bw - r, y], [x + bw, y + r], [x + bw, y + bh - r], [x + bw - r, y + bh], [x + r, y + bh], [x, y + bh - r], [x, y + r]].map(q => [f(q[0] + j(1.1)), f(q[1] + j(1.1))]);
    const c = [[x + bw, y], [x + bw, y + bh], [x, y + bh], [x, y]].map(q => [f(q[0] + j(.9)), f(q[1] + j(.9))]);
    let s = 'M' + e[0][0] + ' ' + e[0][1];
    for (let k = 0; k < 4; k++) {
      const a = e[2 * k], b = e[2 * k + 1], n = e[(2 * k + 2) % 8];
      s += 'Q' + f((a[0] + b[0]) / 2 + j(1.6)) + ' ' + f((a[1] + b[1]) / 2 + j(1.6)) + ' ' + b[0] + ' ' + b[1] + 'Q' + c[k][0] + ' ' + c[k][1] + ' ' + n[0] + ' ' + n[1];

  const dot = (cx, cy, r) => L.push('M' + f(cx - r) + ' ' + f(cy + j(.6)) + 'a' + r + ' ' + f(r * 1.06) + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + f(r * .96) + ' 0 1 0 ' + (-2 * r) + ' 0Z');
  box(4, 4, w - 8, h - 8, 11);

  const lens = [.92, .8, .95, .62, .86, .74, .9, .5, .83, .68], foot = p.links ? 38 : 16;
  for (let y = 60, n = 0; y < h - foot; y += 14, n++) line(18, y, 18 + (w - 36) * lens[n % 10], y);
  if (p.links) box(18, h - 34, 96, 20, 10);

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true"><rect class="wash" x="6" y="6" width="' + (w - 12) + '" height="' + (h - 12) + '" rx="9" style="opacity:' + drawState(d).wash + '"/><g class="ink">'
    + L.map((path, i) => '<path d="' + path + '" pathLength="1" style="stroke-dashoffset:' + dashOffset(i, n, d) + '"/>').join('') + '</g></svg>';
}
function pageInner(i, d, fs, col) {

    + '<h2 class="ttl' + (p.title.length > 19 ? ' long' : '') + '"><i class="tape a"></i><i class="tape b"></i>' + p.title + '</h2>'
    + '<p class="sub" style="font-size:' + fs + 'px">' + p.sub + '</p><i class="rule" style="transform:' + ds.rule + '"></i>'
    + '<div class="figarea"><div class="fig' + (col ? ' col' : '') + '"><div class="aside" style="opacity:' + ds.ao + ';transform:' + ds.at + '">' + aside(p.aside) + '</div><div class="wfbox">' + wireframe(size.w, size.h, p, d) + '</div></div></div>'
    + '<p class="folio"><span>' + esc(SECT[p.c]) + '</span><span>' + pad(i + 1) + ' / ' + N + '</span></p>';

/* Fit the page: the largest question size that leaves room for the figure, side by side or stacked,
   whichever leaves less empty paper. Also notes where the sketch ends up, because the card starts there. */
function layout(i, ratio) {
  const len = P[i].sub.length, top = len < 60 ? 40 : len < 110 ? 34 : len < 180 ? 30 : 27, f = M.m ? 1.2 : 1;
  const sizes = [40, 34, 30, 27, 24, 22, 20, 18.5, 17].filter(v => v <= top).map(v => v * f);
  const best = [];
  for (const col of [0, 1]) {
    const ww = col ? 290 : WFW;
    const size = wfSize[i] = { w: ww, h: clamp(Math.round(ww * ratio), col ? 170 : 124, col ? 250 : 232) };
    for (const fs of sizes) {
      meas.innerHTML = pageInner(i, 1, fs, col);
      const hole = meas.querySelector('.figarea').clientHeight - meas.querySelector('.fig').offsetHeight;
      if (hole >= 44 || fs === sizes[sizes.length - 1]) {
        best[col] = { fs, col, hole, size };
        break;
      }
    }
  }
  const [row, stacked] = best;
  const g = stacked.hole >= 44 && stacked.fs >= row.fs - 3 * f && stacked.hole < row.hole ? stacked : row;
  wfSize[i] = g.size;
  if (g.hole > 150) g.size.h += Math.min(g.hole - 110, 120);   /* still a lot of empty paper: let the sketch grow into it */
  meas.innerHTML = pageInner(i, 1, g.fs, g.col);
  const wf = meas.querySelector('.wfbox');
  g.x = wf.offsetLeft;
  g.y = wf.offsetTop;
  g.hole = meas.querySelector('.figarea').clientHeight - meas.querySelector('.fig').offsetHeight;

/* The left-hand page: the list of pages in this part of the notebook. */
function leftInner(i) {

  P.forEach((p, k) => {
    if (p.c === c) items += '<li><button data-go="' + k + '"' + (k === i ? ' aria-current="true"' : '') + '><i>' + pad(k - first + 1) + '</i><span>' + p.title + '</span></button></li>';

function cardTransformOf(s, p) {

}
/* Work out everything about page i once: how its page is set, and where its answer card has to fly to.

function plan(i) {
  if (geo[i]) return geo[i];
  cmeas.style.width = M.cardW + 'px';
  cmeas.style.transform = 'none';
  cmeas.innerHTML = cardInner(P[i]);
  const g = layout(i, cmeas.offsetHeight / M.cardW);
  cmeas.style.left = (g.x - W / 2) + 'px';
  cmeas.style.top = (g.y - H / 2) + 'px';
  const stageTop = stage.getBoundingClientRect().top, cardY = M.m ? Math.max(M.cardY, g.rule + 14) : M.cardY;
  const s = g.sol = { B: poseB(), X: 0, Y: 0, Z: M.cardZ, k: 1, k0: g.size.w / M.cardW };
  for (let pass = 0; pass < 2; pass++) {
    cmeas.style.transform = cardTransformOf(s, 1);
    const r = cmeas.getBoundingClientRect(), unit = r.width / (M.cardW * s.k);
    s.k = 1 / unit;
    s.X += (M.cardX - r.left) / unit;
    s.Y += (cardY + stageTop - r.top) / unit;

  cmeas.style.transform = cardTransformOf(s, 1);
  g.stageH = Math.max(innerHeight, Math.ceil(cmeas.getBoundingClientRect().bottom - stageTop + (M.m ? 92 : 40)));

/* Plan the rest of the notebook a page at a time while nothing is moving, nearest pages first. */
let planTimer = 0;
function planAhead() {
  clearTimeout(planTimer);
  planTimer = setTimeout(() => {
    if (run) return;
    for (let d = 1; d < N; d++) {
      for (const k of [pos + d, pos - d]) {
        if (k >= 0 && k < N && !geo[k]) { plan(k); planAhead(); return; }
      }
    }
  }, 50);
}

/* ---------- the turning leaf: a row of hinged strips, so the paper bends ---------- */
const strips = [], faces = [];
(function buildScene() {
  leaf.style.setProperty('--sw', SW + 'px');

  for (let k = 0; k < NS; k++) {
    const st = document.createElement('div');
    st.className = 'strip';

      + '<div class="fb"><div class="pgc back" style="left:' + (-(W - (k + 1) * SW)) + 'px"></div><i class="shade"></i></div>';
    faces.push({ f: st.children[0].firstChild, b: st.children[1].firstChild, sf: st.children[0].lastChild, sb: st.children[1].lastChild });
    parent.append(st);
    strips.push(st);

  }
  const sheets = $('#sheets');
  for (let k = 1; k <= 4; k++) {
    for (const side of [-1, 1]) {
      const sh = document.createElement('div');

      sh.style.left = (side < 0 ? -780 - k * 1.6 : -260 + k * 1.6) + 'px';
      sh.style.transform = 'translateZ(' + (-k * 3) + 'px) translateY(' + (k * 1.4) + 'px)';
      sheets.append(sh);

  const dust = $('#dust');
  for (let k = 0; k < 22; k++) {

    mote.style.top = (8 + (k * 53) % 84) + '%';
    mote.style.animationDelay = (-k * 1.7) + 's';

})();
/* The same picture goes on every strip; each strip shows its own slice of it. */
function fillFaces(front, back, sec, cover) {
  for (const f of faces) {
    f.f.innerHTML = front;
    f.f.classList.toggle('coverface', !!cover);
    f.f.style.setProperty('--sec', sec);

}
function fillLeaf(front, d, back) { fillFaces(pageInner(front, d), leftInner(back), COL[P[front].c]); }
function fillCover() {
  fillFaces('<div class="cv"><div class="cv-label"><small>Synergy · Quest 5</small><b>Interview notes</b><span>Umut Şirin at Discord</span><em>Hasan Furkan · November 2026</em></div>'
    + '<div class="stamp">' + LOGO + '</div><i class="cv-band"></i></div>', leftInner(0), COL[0], true);
}
function setTurn(u) {
  const base = -180 * io(u);
  const bend = (-64 * Math.sin(2 * Math.PI * u) - 20 * Math.sin(Math.PI * u)) / NS;
  for (let k = 0; k < NS; k++) {
    strips[k].style.transform = 'rotateY(' + (k ? bend : base).toFixed(3) + 'deg)';
    const sh = (.36 * Math.sin(clamp(-(base + (k + .5) * bend), 0, 180) * Math.PI / 180)).toFixed(3);
    faces[k].sf.style.opacity = sh;
    faces[k].sb.style.opacity = sh;
  }
  const lift = Math.sin(Math.PI * u);
  tshR.style.opacity = (.55 * lift * (1 - u)).toFixed(3);
  tshL.style.opacity = (.55 * lift * u).toFixed(3);

/* ---------- a small timeline: tracks run between a and b, events fire once at a ---------- */
let run = null, pending = -1;
function play(tracks, total) {
  tracks.sort((x, y) => x.a - y.a);
  run = { tracks, total, raf: 0, t: 0, last: 0, rate: 1, frames: 0 };
  leaf.classList.add('prime');
  const tick = now => {
    if (!run) return;
    /* The first two frames only get things painted: the leaf that was just laid down, both of its sides.
       After that a late frame is not made up for by jumping ahead; the motion carries on from where it was. */
    if (++run.frames < 2) { run.raf = requestAnimationFrame(tick); return; }
    if (run.frames === 2) leaf.classList.remove('prime');
    if (run.last) run.t += Math.min(now - run.last, 40) * run.rate;
    run.last = now;
    if (seek(run.t)) run.raf = requestAnimationFrame(tick);
  };
  run.raf = requestAnimationFrame(tick);
}
/* Draw the running timeline at time t (ms). Returns false once it has ended. */
function seek(t) {
  if (!run) return false;
  for (const k of run.tracks) step(k, t);
  if (t < run.total) return true;
  run = null;
  if (pending >= 0) { const next = pending; pending = -1; go(next); }
  return false;
}
/* Stop the clock so a recorder can call seek() frame by frame. */
function hold() { if (run) cancelAnimationFrame(run.raf); leaf.classList.remove('prime'); }
function step(k, t) {
  if (k.done || t < k.a) return;
  if (k.ev) { k.done = true; k.ev(); return; }
  const v = clamp((t - k.a) / (k.b - k.a));
  k.f(k.e ? k.e(v) : v);
  if (v >= 1) k.done = true;
}
function finish() {
  pending = -1;
  if (!run) return;
  cancelAnimationFrame(run.raf);
  leaf.classList.remove('prime');
  for (const k of run.tracks) step(k, Infinity);
  run = null;
}

/* ---------- navigation ---------- */
function show(i) {
  prepCard(i);
  renderPage(i, 1);
  renderLeft(i);
  leaf.hidden = true;
  book.classList.remove('closed');
  setTurn(0);
  setCam(poseB());
  setLift(1);
  planAhead();
}
/* Go straight to page i with no animation. */
function jump(i) {
  finish();
  pos = i;
  hud();
  show(i);
}
function hud() {
  const p = P[pos];
  $('#wt').textContent = SECT[p.c];
  $('#wc').textContent = pad(pos + 1) + ' / ' + N;
  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === N - 1;
  document.querySelectorAll('.secs button').forEach((b, k) => b.setAttribute('aria-pressed', k === p.c));
  document.querySelectorAll('#list button').forEach((b, k) => b.setAttribute('aria-current', k === pos));
  $('#live').textContent = 'Page ' + (pos + 1) + ' of ' + N + '. ' + SECT[p.c] + ': ' + p.title.replace(/&amp;/g, '&');
}
function go(i) {
  if (i < 0 || i >= N || gateOpen) return;
  /* Something is still moving: let it finish quickly and go to the new page straight after, so nothing snaps. */
  if (run) { pending = i; run.rate = 6; return; }
  if (i === pos) return;
  const from = pos, dir = i > from ? 1 : -1;
  pos = i;
  hud();
  if (scrollY) scrollTo(0, 0);
  if (reduce.matches) { show(i); return; }
  const B = poseB(), A = poseA(i);
  /* Lay the leaf over what is already showing, and change what lies under it, before anything moves. */
  if (dir > 0) { fillLeaf(from, 1, i); setTurn(0); leaf.hidden = false; renderPage(i, 0); }
  else { plan(i); fillLeaf(i, 0, from); setTurn(1); leaf.hidden = false; renderLeft(i); }
  play([
    { a: 0, b: 180, f: v => setLift(1 - v), e: io },
    { a: 181, ev() { prepCard(i); setLift(0); } },
    { a: 160, b: 940, f: v => setTurn(dir > 0 ? v : 1 - v) },
    { a: 100, b: 940, f: v => setCam(mixPose(B, A, v)), e: io },
    { a: 941, ev() { if (dir < 0) renderPage(i, 0); else renderLeft(i); leaf.hidden = true; setTurn(0); } },
    { a: 860, b: 1400, f: setDraw },
    { a: 1340, b: 2080, f: setLift, e: out },
    { a: 1340, b: 2080, f: v => setCam(mixPose(A, B, v)), e: io },
    { a: 2090, ev: planAhead },
  ], 2100);
}
/* The notebook lies closed on the desk, the cover opens, the first sketch draws itself and the answer lifts off. */
const farPose = () => ({ rx: 62, rz: -34, s: M.s * .74, fx: 120, fy: -30 });
/* Lay the closed notebook out. Done early, behind the envelope, so the opening itself has nothing left to prepare. */
function stageIntro() {
  finish();
  pos = 0;
  hud();
  if (reduce.matches) return;
  prepCard(0);
  renderPage(0, 0);
  renderLeft(0);
  setLift(0);
  fillCover();
  setTurn(0);
  leaf.hidden = false;
  book.classList.add('closed');
  setCam(farPose());
}
function intro() {
  if (reduce.matches) { finish(); pos = 0; hud(); show(0); return; }
  if (!book.classList.contains('closed') || run) stageIntro();
  const far = farPose(), A = poseA(0), B = poseB();
  play([
    { a: 0, b: 1300, f: v => setCam(mixPose(far, A, v)), e: io },
    { a: 520, b: 1500, f: setTurn },
    { a: 1250, ev() { book.classList.remove('closed'); } },
    { a: 1501, ev() { leaf.hidden = true; setTurn(0); } },
    { a: 1380, b: 1960, f: setDraw },
    { a: 1880, b: 2680, f: setLift, e: out },
    { a: 1880, b: 2680, f: v => setCam(mixPose(A, B, v)), e: io },
    { a: 2690, ev: planAhead },
  ], 2700);
}

/* ---------- opening: an envelope, a point of light, the Discord mark, then the notebook ---------- */
const gate = $('#gate'), fx = $('#fx'), seal = $('#seal');
let gateOpen = true, opening = null;
const T = { spiral: [250, 1850], settle: 2450, intro: 2750, scatter: 2850, end: 3800 };
function buildOpening() {
  const dpr = Math.min(devicePixelRatio || 1, 2), vw = innerWidth, vh = innerHeight;
  fx.width = Math.round(vw * dpr);
  fx.height = Math.round(vh * dpr);
  const ctx = fx.getContext('2d');
  const sr = seal.getBoundingClientRect(), sx = sr.left + sr.width / 2, sy = sr.top + sr.height / 2;
  const mw = clamp(Math.min(vw * .34, vh * .5), 150, 380), mh = mw * 48 / 64, cx = vw / 2, cy = vh * .45;
  /* Sample points inside the mark by painting it small and reading the pixels back. */
  const res = 4, tw = Math.round(mw / res), th = Math.round(mh / res);
  const tmp = document.createElement('canvas');
  tmp.width = tw; tmp.height = th;
  const tc = tmp.getContext('2d');
  tc.scale(tw / 64, th / 48);
  const mark = new Path2D(MARK_D);
  tc.fill(mark);
  const px = tc.getImageData(0, 0, tw, th).data, pts = [];
  const want = vw < 760 ? 1100 : 2100;
  let inside = 0;
  for (let k = 3; k < px.length; k += 4) if (px[k] > 128) inside++;
  const every = Math.max(1, inside / want);
  let acc = 0, n = 0;
  for (let y = 0; y < th; y++) {
    for (let x = 0; x < tw; x++) {
      if (px[(y * tw + x) * 4 + 3] <= 128) continue;
      acc += 1;
      if (acc < every) continue;
      acc -= every;
      n++;
      pts.push({ x: cx - mw / 2 + (x + rnd(n * 3)) * res, y: cy - mh / 2 + (y + rnd(n * 3 + 1)) * res, n });
    }
  }
  const [s0, s1] = T.spiral;
  /* The point of light: it leaves the seal, circles the place where the mark will be, and ends at its centre. */
  const light = t => {
    const s = clamp((t - s0) / (s1 - s0)), e = io(s), r = mw * .78 * Math.pow(Math.sin(Math.PI * s), .8) * (1 - .3 * s), a = s * Math.PI * 4.6 + 1.2;
    return { x: mixn(sx, cx, e) + r * Math.cos(a), y: mixn(sy, cy, e) + r * .42 * Math.sin(a), s };
  };
  for (const p of pts) {
    const order = 1 - (p.y - (cy - mh / 2)) / mh;                       /* the mark fills from the bottom up */
    p.t0 = s0 + (s1 - s0) * clamp(.06 + .8 * order + (rnd(p.n * 7) - .5) * .16, .03, .95);
    p.dur = 480 + rnd(p.n * 11) * 220;
    const l = light(p.t0);
    p.sx = l.x; p.sy = l.y;
    p.sw = (rnd(p.n * 13) - .5) * 90;
    p.size = 1.2 + rnd(p.n * 17) * 1.7;
    p.ph = rnd(p.n * 19) * 6.28;
    const dx = p.x - cx, dy = p.y - cy, len = Math.hypot(dx, dy) || 1, sp = 160 + rnd(p.n * 23) * 520;
    p.vx = dx / len * sp + (rnd(p.n * 29) - .5) * 160;
    p.vy = dy / len * sp + (rnd(p.n * 31) - .5) * 160 - 60;
  }
  const glow = document.createElement('canvas');
  glow.width = glow.height = 128;
  const gc = glow.getContext('2d'), gg = gc.createRadialGradient(64, 64, 0, 64, 64, 64);
  gg.addColorStop(0, 'rgba(255,248,225,1)'); gg.addColorStop(.18, 'rgba(255,214,130,.75)'); gg.addColorStop(.5, 'rgba(255,170,70,.18)'); gg.addColorStop(1, 'rgba(255,150,40,0)');
  gc.fillStyle = gg; gc.fillRect(0, 0, 128, 128);

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, vw, vh);
    ctx.globalCompositeOperation = 'lighter';
    const sc = clamp((t - T.scatter) / (T.end - T.scatter)), scs = sc * (T.end - T.scatter) / 1000;
    const pulse = clamp(1 - Math.abs(t - T.settle) / 320);
    /* a faint solid mark underneath, so the shape reads at once when the last points land */
    const solid = clamp((t - (T.settle - 500)) / 500) * (1 - clamp(sc * 2.2)) * .1 + pulse * .2;
    if (solid > .003) {
      ctx.save();
      ctx.translate(cx - mw / 2, cy - mh / 2);
      ctx.scale(mw / 64, mh / 48);
      ctx.fillStyle = 'rgba(120,132,255,' + solid.toFixed(3) + ')';
      ctx.fill(mark);
      ctx.restore();
    }
    for (const p of pts) {
      const v = (t - p.t0) / p.dur;
      if (v <= 0) continue;
      const e = out(clamp(v)), bow = Math.sin(Math.PI * clamp(v)) * p.sw;
      let x = mixn(p.sx, p.x, e) + bow * .6, y = mixn(p.sy, p.y, e) - Math.abs(bow) * .5, alpha = .72 + .28 * Math.sin(t / 190 + p.ph), size = p.size;
      const cool = clamp(v * 1.4 - .5);
      if (sc > 0) {
        x += p.vx * scs * (1 - sc * .35);
        y += p.vy * scs * (1 - sc * .35);
        alpha *= 1 - sc;
        size *= 1 - sc * .5;
      }
      alpha = clamp(alpha + pulse * .5) * clamp(v * 6);
      ctx.fillStyle = 'rgba(' + Math.round(mixn(255, 136, cool)) + ',' + Math.round(mixn(214, 150, cool)) + ',' + Math.round(mixn(130, 255, cool)) + ',' + alpha.toFixed(3) + ')';
      ctx.fillRect(x - size / 2, y - size / 2, size, size);
    }
    /* sparks shed by the light on its way */
    if (t > s0 && t < s1 + 520) {
      const step = 7, first = Math.max(0, Math.ceil((t - 520 - s0) / step)), last = Math.min(Math.floor((t - s0) / step), Math.floor((s1 - s0) / step));
      for (let k = first; k <= last; k++) {
        const born = s0 + k * step, age = (t - born) / 520, l = light(born);
        const x = l.x + (rnd(k * 5) - .5) * 70 * age, y = l.y + (rnd(k * 5 + 1) - .2) * 90 * age, sz = 2.4 * (1 - age);
        ctx.fillStyle = 'rgba(255,220,150,' + (.8 * (1 - age)).toFixed(3) + ')';
        ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
      }
    }
    if (t < s1 + 260) {
      const l = light(t), a = clamp(t / 200) * (1 - clamp((t - s1) / 260)), r = 54 + 14 * Math.sin(t / 90) + 90 * clamp((t - s1) / 260);
      ctx.globalAlpha = a;
      ctx.drawImage(glow, l.x - r, l.y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
    }
    if (pulse > 0) {
      const r = mw * (.55 + .5 * (1 - pulse) * (t > T.settle ? 1 : 0));
      ctx.strokeStyle = 'rgba(200,206,255,' + (pulse * .45).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
    }
  }
  return { draw };
}
function startOpening() {
  if (opening) { endGate(); return; }
  if (reduce.matches) { endGate(); return; }
  opening = buildOpening();
  stageIntro();
  opening.t = 0; opening.last = 0; opening.raf = 0; opening.intro = false; opening.night = false;
  gate.classList.add('go');
  const tick = now => {
    if (!opening) return;
    if (opening.last) opening.t += Math.min(now - opening.last, 40);
    opening.last = now;
    openSeek(opening.t);
    if (opening) opening.raf = requestAnimationFrame(tick);
  };
  opening.raf = requestAnimationFrame(tick);
}
/* Draw the opening at time t (ms) and fire what belongs to that moment. */
function openSeek(t) {
  if (!opening) return;
  opening.draw(t);
  if (t >= T.intro && !opening.intro) { opening.intro = true; ungate(); intro(); }
  if (t >= T.scatter && !opening.night) { opening.night = true; gate.classList.add('out'); }
  if (t >= T.end) removeGate();
}
function openHold() { if (opening) cancelAnimationFrame(opening.raf); }
/* The page behind the envelope becomes usable. */
function ungate() {
  gateOpen = false;
  document.body.classList.remove('gated');
  for (const el of document.querySelectorAll('[data-behind]')) el.inert = false;
}
function removeGate() {
  if (opening) cancelAnimationFrame(opening.raf);
  opening = null;
  gate.remove();
}
/* Skip: straight to the notebook. */
function endGate() {
  if (!gate.isConnected) return;
  const started = opening && opening.intro;
  if (gateOpen) ungate();
  gate.classList.add('out', 'fast');
  if (opening) cancelAnimationFrame(opening.raf);
  opening = null;
  setTimeout(() => gate.remove(), 260);
  if (!started) intro();
}
seal.addEventListener('click', ev => { ev.stopPropagation(); startOpening(); });
$('#skip').addEventListener('click', ev => { ev.stopPropagation(); endGate(); });
gate.addEventListener('click', () => { if (opening) endGate(); });

/* ---------- controls ---------- */
const secs = $('.secs'), list = $('#list'), toc = $('#toc');
SECT.forEach((name, c) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.style.setProperty('--c', COL[c]);
  b.onclick = () => go(P.findIndex(p => p.c === c));
  secs.append(b);
  const h = document.createElement('h3'), ol = document.createElement('ol');
  h.textContent = name;
  h.style.setProperty('--c', COL[c]);
  list.append(h, ol);
});
P.forEach((p, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.innerHTML = p.title;
  b.onclick = () => { toc.close(); go(i); };
  li.append(b);
  list.querySelectorAll('ol')[p.c].append(li);
});
$('#index').onclick = () => toc.showModal();
$('#where').onclick = () => toc.showModal();
$('#close').onclick = () => toc.close();
$('#prev').onclick = () => go(pos - 1);
$('#next').onclick = () => go(pos + 1);
corner.onclick = () => go(pos + 1);
leftc.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-go]');
  if (b) go(+b.dataset.go);
});
card.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-go]');
  if (b) go(+b.dataset.go);
});
addEventListener('keydown', ev => {
  if (toc.open || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (gate.isConnected && ev.key === 'Escape') { endGate(); return; }
  const target = pending >= 0 ? pending : pos;
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); go(target + 1); }
  if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); go(target - 1); }
});
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (opening) return;   /* the opening keeps its own size until it is over */
    finish(); applyMetrics(); show(pos);
  }, 120);
});

/* Hooks for checking single frames of the animation. */
window.sketchbook = { go, jump, finish, show, intro, plan, renderLeft, hold, seek, setTurn, setDraw, setLift, setCam, fillLeaf, fillCover, renderPage, prepCard, poseA, poseB, mixPose, leaf, book,
  startOpening, endGate, openHold, openSeek, T,
  get pos() { return pos; }, get running() { return !!run; }, get pending() { return pending; }, get gated() { return gateOpen; }, get planned() { return Object.keys(geo).length; } };

applyMetrics();
hud();
show(0);
</script>
